[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfops"
version = "0.1.0"
description = "Reliable PDF operations for LLM agents, with JSON reports and JSON Schemas"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0",
    "pdfplumber>=0.11",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
    "jsonschema>=4.18",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
